version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: always
    ports:
      - 5001:5000
    volumes:
      - ./osrm-data:/data
    working_dir: /data
    entrypoint: sh
    command: >
      -c "
      echo 'Checking for OSM data...' &&
      if [ ! -f nrw-latest.osrm.mldgr ]; then
        echo 'Processing OSM file (this may take 10 minutes)...' &&
        osrm-extract --profile /opt/car.lua nrw-latest.osm.pbf &&
        echo 'Partitioning...' &&
        osrm-partition nrw-latest.osrm &&
        echo 'Customizing...' &&
        osrm-customize nrw-latest.osrm;
      fi &&
      echo 'Starting OSRM server...' &&
      osrm-routed --algorithm=mld nrw-latest.osrm
      "
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/5000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

volumes:
  pgdata:
  osrm-data: